<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <script>
    (function () {
      const savedTheme = localStorage.getItem('theme') || 'system';
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme === 'system' ? (prefersDark ? 'dark' : 'light') : savedTheme;
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>登录</title>
  <link href="/daisyui@5.css" rel="stylesheet" type="text/css">
  <script src="/tailwindcss@4.js"></script>
  <style>
    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .lang-option.active {
      color: hsl(var(--p));
      font-weight: 700;
    }
  </style>
</head>
<body class="bg-base-200 text-base-content">
  <div class="absolute right-4 top-4 flex items-center gap-2">
    <div class="dropdown dropdown-end">
      <button tabindex="0" id="lang-toggle-btn" class="btn btn-ghost btn-circle" type="button" aria-label="Switch language">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="h-6 w-6">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/>
        </svg>
      </button>
      <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-50 w-36 p-2 shadow">
        <li><button type="button" class="lang-option" data-lang="zh">中文</button></li>
        <li><button type="button" class="lang-option" data-lang="en">English</button></li>
        <li><button type="button" class="lang-option" data-lang="es">Español</button></li>
      </ul>
    </div>
    <button id="theme-toggle-btn" class="btn btn-ghost btn-circle" type="button" aria-label="切换主题">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="h-6 w-6">
        <path id="theme-toggle-path" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
      </svg>
    </button>
  </div>

  <main class="flex min-h-screen items-center justify-center px-4 py-8">
    <div class="card w-full max-w-md bg-base-100 shadow-xl">
      <div class="card-body gap-5 p-8">
        <div class="text-center">
          <h1 class="text-2xl font-bold" data-i18n="login.h1">登录</h1>
          <p class="mt-2 text-sm text-base-content/60" data-i18n="login.subtitle">输入管理密码进入后台</p>
        </div>
        <label class="form-control">
          <span class="label-text mb-2" data-i18n="login.password.label">管理密码</span>
          <input id="password" type="password" class="input input-bordered w-full" placeholder="请输入管理密码" data-i18n-ph="login.password.placeholder" autocomplete="current-password">
        </label>
        <button id="login-btn" type="button" class="btn btn-primary" data-i18n="login.btn">登 录</button>
        <div id="error-box" class="alert alert-error hidden">
          <span id="error-text" data-i18n="login.error.wrong">密码错误，请重试</span>
        </div>
      </div>
    </div>
  </main>

  <footer class="border-t border-base-300 bg-base-100/80 py-4 text-center text-sm text-base-content/60 backdrop-blur">
    <p>
      GitHub:
      <a href="https://github.com/xxnuo/serverless-qrcode-hub" class="link link-primary" target="_blank">xxnuo/serverless-qrcode-hub</a>
    </p>
  </footer>

  <script>
    const TRANSLATIONS = {
      zh: {
        'page.title': '登录',
        'login.h1': '登录',
        'login.subtitle': '输入管理密码进入后台',
        'login.password.label': '管理密码',
        'login.password.placeholder': '请输入管理密码',
        'login.btn': '登 录',
        'login.loading': '登录中...',
        'login.success': '登录成功',
        'login.error.wrong': '密码错误，请重试',
        'login.error.empty': '请输入管理密码',
        'login.error.default': '登录失败，请重试',
        'theme.toggle': '切换主题',
      },
      en: {
        'page.title': 'Login',
        'login.h1': 'Login',
        'login.subtitle': 'Enter admin password to continue',
        'login.password.label': 'Admin Password',
        'login.password.placeholder': 'Enter admin password',
        'login.btn': 'Login',
        'login.loading': 'Logging in...',
        'login.success': 'Login successful',
        'login.error.wrong': 'Incorrect password, please retry',
        'login.error.empty': 'Please enter the admin password',
        'login.error.default': 'Login failed, please retry',
        'theme.toggle': 'Toggle theme',
      },
      es: {
        'page.title': 'Iniciar sesión',
        'login.h1': 'Iniciar sesión',
        'login.subtitle': 'Ingrese la contraseña de administrador para continuar',
        'login.password.label': 'Contraseña de administrador',
        'login.password.placeholder': 'Ingrese la contraseña',
        'login.btn': 'Iniciar sesión',
        'login.loading': 'Iniciando sesión...',
        'login.success': 'Inicio de sesión exitoso',
        'login.error.wrong': 'Contraseña incorrecta, intente de nuevo',
        'login.error.empty': 'Por favor ingrese la contraseña de administrador',
        'login.error.default': 'Error al iniciar sesión, intente de nuevo',
        'theme.toggle': 'Cambiar tema',
      }
    };

    function getLang() {
      return localStorage.getItem('lang') || 'zh';
    }

    function t(key) {
      const lang = getLang();
      return (TRANSLATIONS[lang] && TRANSLATIONS[lang][key]) || (TRANSLATIONS.zh && TRANSLATIONS.zh[key]) || key;
    }

    function applyLang() {
      const lang = getLang();
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang === 'es' ? 'es' : 'en';
      document.title = t('page.title');
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.dataset.i18n);
      });
      document.querySelectorAll('[data-i18n-ph]').forEach(el => {
        el.placeholder = t(el.dataset.i18nPh);
      });
      document.querySelectorAll('.lang-option').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
    }

    const elements = {
      themeToggleBtn: document.getElementById('theme-toggle-btn'),
      themeTogglePath: document.getElementById('theme-toggle-path'),
      password: document.getElementById('password'),
      loginBtn: document.getElementById('login-btn'),
      errorBox: document.getElementById('error-box'),
      errorText: document.getElementById('error-text')
    };

    function getThemeMode() {
      return localStorage.getItem('theme') || 'system';
    }

    function updateThemeIcon(mode) {
      if (mode === 'system') {
        elements.themeTogglePath.setAttribute('d', 'M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z');
      } else if (mode === 'light') {
        elements.themeTogglePath.setAttribute('d', 'M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z');
      } else {
        elements.themeTogglePath.setAttribute('d', 'M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z');
      }
    }

    function applyTheme(mode) {
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const actual = mode === 'system' ? (prefersDark ? 'dark' : 'light') : mode;
      document.documentElement.setAttribute('data-theme', actual);
      updateThemeIcon(mode);
    }

    function cycleTheme() {
      const current = getThemeMode();
      const next = current === 'system' ? 'light' : current === 'light' ? 'dark' : 'system';
      localStorage.setItem('theme', next);
      applyTheme(next);
    }

    function setError(message) {
      elements.errorText.textContent = message;
      elements.errorBox.classList.remove('hidden');
    }

    function hideError() {
      elements.errorBox.classList.add('hidden');
    }

    async function request(url, options = {}) {
      const init = { method: options.method || 'GET', headers: { ...(options.headers || {}) } };
      if (options.body !== undefined) {
        init.headers['Content-Type'] = 'application/json';
        init.body = JSON.stringify(options.body);
      }
      const response = await fetch(url, init);
      const contentType = response.headers.get('content-type') || '';
      const payload = contentType.includes('application/json') ? await response.json() : await response.text();
      if (!response.ok) {
        if (typeof payload === 'object' && payload && payload.error) {
          throw new Error(payload.error);
        }
        throw new Error(typeof payload === 'string' ? payload : t('login.error.default'));
      }
      return payload;
    }

    async function checkSession() {
      try {
        await request('/api/session');
        location.href = '/admin';
      } catch {
      }
    }

    async function login() {
      const password = elements.password.value;
      if (!password) {
        setError(t('login.error.empty'));
        elements.password.focus();
        return;
      }
      hideError();
      elements.loginBtn.disabled = true;
      elements.loginBtn.innerHTML = `<span class="loading loading-spinner loading-sm"></span>${t('login.loading')}`;
      try {
        await request('/api/login', { method: 'POST', body: { password } });
        elements.loginBtn.innerHTML = t('login.success');
        location.href = '/admin';
      } catch (error) {
        setError(error.message || t('login.error.default'));
        elements.loginBtn.disabled = false;
        elements.loginBtn.textContent = t('login.btn');
      }
    }

    function init() {
      applyTheme(getThemeMode());
      applyLang();
      elements.themeToggleBtn.addEventListener('click', cycleTheme);
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (getThemeMode() === 'system') {
          applyTheme('system');
        }
      });
      elements.loginBtn.addEventListener('click', login);
      elements.password.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          login();
        }
      });
      document.querySelectorAll('.lang-option').forEach(btn => {
        btn.addEventListener('click', () => {
          localStorage.setItem('lang', btn.dataset.lang);
          applyLang();
          // Close dropdown by removing focus
          document.activeElement?.blur();
        });
      });
      elements.password.focus();
      checkSession();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
